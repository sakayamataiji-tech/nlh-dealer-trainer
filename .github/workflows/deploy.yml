name: Deploy to GitHub Pages

# Production URL:
#   - Set the repository variable CUSTOM_DOMAIN (Settings → Secrets and variables → Actions → Variables),
#     e.g. "dealertrainer.jp", to build for the custom domain (served at the domain root).
#   - Without it, the site is built for https://<owner>.github.io/<repo>/.
on:
  push:
    branches: [main, "claude/charming-archimedes-2ra0ey"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test
      - name: Resolve site URL
        env:
          CUSTOM_DOMAIN: ${{ vars.CUSTOM_DOMAIN }}
          REPO: ${{ github.event.repository.name }}
          OWNER: ${{ github.repository_owner }}
        run: |
          if [ -n "$CUSTOM_DOMAIN" ]; then
            echo "PAGES_BASE_PATH=" >> "$GITHUB_ENV"
            echo "SITE_URL=https://$CUSTOM_DOMAIN" >> "$GITHUB_ENV"
          else
            echo "PAGES_BASE_PATH=/$REPO" >> "$GITHUB_ENV"
            echo "SITE_URL=https://$OWNER.github.io/$REPO" >> "$GITHUB_ENV"
          fi
          if grep -q '【' src/config/site.ts; then
            echo "::warning file=src/config/site.ts::Operator name / contact are still placeholders (see docs/RELEASE.md)."
          fi
      - run: npm run build
      - run: touch out/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
